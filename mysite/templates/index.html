<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
</head>
<body>
    <h1>Bitcoin: <span id="btc">---</span>$</h1>
    <script>
        const ws = new WebSocket('ws://localhost:8000/ws/crypto/');
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.bitcoint) document.getElementById('btc').innetText = data.bitcoin;
        };
    </script>
</body>
</html>
